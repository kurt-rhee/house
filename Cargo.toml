[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
house-core = { path = "crates/core" }
house-geometry = { path = "crates/geometry" }
house-commands = { path = "crates/commands" }
house-io = { path = "crates/io" }
house-mcp = { path = "crates/mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4", "serde"] }
kurbo = "0.13.1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
rmcp = { version = "3.9", features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "macros"] }
axum = "0.8"
schemars = "1"
dxf = "0.6.2"
