<text x="38.000" y="719.000" font-size="11" >Overall spans and opening locations from After plan revision 55. Opening sizes checked against Blender.</text>
<text x="38.000" y="734.000" font-size="11" >H = opening height. S = sill above finished floor. W = full width of a partially hidden opening.</text>
<text x="38.000" y="749.000" font-size="11" >Dashed openings are CAD proposals with unset heights. Imperial dimensions are rounded to the nearest inch.</text>
<text x="38.000" y="764.000" font-size="11" >North points down on floor plans. F.F. / AFF reference finished floor. Roof and exterior levels are unverified.</text>
